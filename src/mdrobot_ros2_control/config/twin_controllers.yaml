# Config for a TWIN base: two single-channel MDROBOT controllers (e.g. two MD400)
# on one serial bus at distinct slave IDs, laid out as a 2-wheel differential base.
#
# Two sections:
#   mdrobot_hardware  - serial connection + PER-WHEEL controller settings.
#                       bringup.launch.py reads this and injects it into the URDF;
#                       controller_manager ignores it. Set EACH motor's Modbus id
#                       (motor_id_L / motor_id_R — MUST differ), direction and
#                       counts/rev HERE. The two controllers must already have
#                       distinct slave ids (re-ID one with PID_ID(133) first).
#   controller_manager / diff_cont - the controllers themselves.
#
# diff_cont drives motor_L (left) / motor_R (right) from /diff_cont/cmd_vel.
# The geometry below is measured on THIS rig — see the notes at diff_cont.
# On a different robot, re-derive both from your own wheel and track.
mdrobot_hardware:
  ros__parameters:
    # ⚠ by-id 를 쓴다. /dev/ttyUSB0 은 재삽입·부팅 순서에 따라 번호가 바뀌고,
    #   test/ 의 브링업 스크립트가 전부 이 경로를 쓴다 (preflight.py:39 등).
    port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG043HTG-if00-port0
    baudrate: 19200
    # Per-wheel Modbus slave ids — MUST be distinct (on_init rejects equal ids).
    #
    # Measured 2026-08-14 by driving each unit alone with the base lifted and
    # watching the wheels (docs/hardware_test_20260814.md sections 2 and 6):
    #
    #     id=1  ->  RIGHT wheel   +rpm turns it FORWARD
    #     id=2  ->  LEFT  wheel   +rpm turns it BACKWARD   (mirrored mount)
    #
    # "right"/"forward" in the ROS sense, facing the direction of travel.
    #
    # This file previously had motor_id_L: 1, which is backwards and would have
    # made diff_cont steer mirrored. The ids are now swapped; reverse_L/reverse_R
    # keep their values because "the left one is the mirrored one" happens to
    # hold either way, but they now apply to the units that actually need them.
    motor_id_L: 2
    motor_id_R: 1
    # The motors are mounted mirrored, so the left one has to be inverted for a
    # positive joint command to drive the robot forward. mdrobot_system.cpp:418
    # applies direction symmetrically to commands and feedback, so odometry sign
    # stays consistent.
    reverse_L: true      # id=2, left  — +rpm drives the robot backwards
    reverse_R: false     # id=1, right — +rpm drives the robot forwards
    # Per-wheel counts/rev (hall = 3 x pole count; MD400 8-pole ~ 24). 0 = raw.
    # Both sides are 30.0, so the id swap above does not move these.
    counts_per_rev_L: 30.0
    counts_per_rev_R: 30.0
    use_limit_sw: 0      # -1 leave as-is / 0 disable / 1 enable (some need 0 for serial)
    auto_enable: true

controller_manager:
  ros__parameters:
    # 10 Hz: a twin read()+write() cycle is ~4 serial round-trips at 19200 baud
    # (2x read_monitor + 2x VEL_CMD writes) — one more than dual, because twin
    # cannot batch the two controllers into a single transaction. ~68-78 ms of
    # bus work, so 15 Hz overruns like dual at 20 Hz; 10 Hz leaves a safe margin.
    # Raise to 12 only if a bench measurement of read()+write() confirms <80 ms.
    update_rate: 10

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_cont:
      type: diff_drive_controller/DiffDriveController

diff_cont:
  ros__parameters:
    left_wheel_names: ["motor_L"]
    right_wheel_names: ["motor_R"]
    # ⚠ wheel_radius is an EFFECTIVE radius with the gearbox folded in, not the
    #   tyre radius. counts_per_rev above is 30 = counts per MOTOR-shaft rev, so
    #   the joint interfaces report motor-shaft rad / rad/s. diff_drive_controller
    #   multiplies by wheel_radius, so that value must be tyre_radius / gear_ratio.
    #
    #     tyre 10 inch -> 0.254 m dia -> 0.127 m radius   (2026-09-03, measured)
    #     K10H30BU gearbox 30:1
    #     0.127 / 30 = 0.004233 m
    #
    #   The old value 0.00307 implied a 92 mm wheel (7.25 inch) and was 1.38x off:
    #   commanded speed ran ~38% fast and odometry read ~28% slow. Nobody caught it
    #   because the twin path has never been driven on hardware (README: experimental).
    #
    # ⚠⚠ STILL WRONG — 2026-09-05. The derivation above omits a TIMING BELT stage
    #   between the gearbox output and the wheel (22 T motor side : 17 T wheel side,
    #   user-confirmed 09-05). No file in this repo knew about it, so every
    #   counts->metres conversion here and in test/ has been off.
    #
    #   Measured directly by hand-pushing a 6.000 m taped course with torque off
    #   (test/wheel_circ_push.py, zero traction => zero slip):
    #
    #       0.7613 mm per count      <- the only thing actually measured
    #       vs 0.8867 mm/count assumed here (900 counts/rev x 0.798 m)  = -14.1%
    #
    #   Splitting that into (counts per motor-rev) x (gearbox) x (belt) x (tyre)
    #   does NOT close yet: a 250 mm tyre needs ~1031 counts/wheel-rev, which is
    #   neither 30:1 (900) nor 30x17/22 (696) nor 30x22/17 (1165). The suspect is
    #   "30 counts per motor-rev", which this repo has never measured -- CLAUDE.md
    #   says to measure it, not to hardcode it.
    #
    #   DO NOT guess a new value. Roll the tyre exactly 3 revolutions along a taped
    #   course: counts/wheel-rev = dcount/3 and loaded circumference = distance/3,
    #   which pins the belt direction and counts_per_rev at once. Then
    #       wheel_radius = 0.0007613 m/count * counts_per_rev / (2*pi)
    #   Left at the old value so the error stays visible rather than half-fixed.
    #   See docs/hardware_test_20260905.md section 6.
    wheel_radius: 0.004233

    # ✅ MEASURED 2026-09-05 — 451 mm centre-to-centre between the wheels (tape).
    #   The old 0.4 had been carried since the twin mode was written and was 13%
    #   low; odometry yaw scales directly with this, so headings read 13% large.
    wheel_separation: 0.451
    # State feedback is in SI when counts_per_rev is set in the URDF.
    open_loop: false
    base_frame_id: base_link
    publish_rate: 20.0
    cmd_vel_timeout: 0.5
    # Jazzy diff_drive_controller subscribes to geometry_msgs/TwistStamped on
    # <controller>/cmd_vel (the old use_stamped_vel toggle is gone).
    # Keep limits permissive; the generic driver leaves safety to the robot layer.
    linear:
      x:
        max_velocity: 1.0
        min_velocity: -1.0
    angular:
      z:
        max_velocity: 2.0
        min_velocity: -2.0
